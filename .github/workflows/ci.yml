name: CI

# PR（dev / main 向け）と dev・main への push で、単体テスト・lint・debug ビルドを実行する
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチで新しい push があったら、古い実行は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 のプラットフォームがランナーに無い場合に備えて入れておく
      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Unit tests, lint and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --continue

      # 失敗したときに原因を見られるよう、テストと lint のレポートを残す
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
